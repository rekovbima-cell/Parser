name: Split docs for reading

on:
  push:
    branches: [main]
    paths: ['.github/workflows/split-docs.yml', 'scripts/split_docs.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split big files
        run: python3 scripts/split_docs.py
      - name: Push split branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b split-docs
          git add SPLIT
          git commit -m "Split docs for reading"
          git push origin split-docs --force
